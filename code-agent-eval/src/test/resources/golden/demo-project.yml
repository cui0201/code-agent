  - id: q019
    category: 事实查询
    question: OrderStatus 枚举包含哪些取值？
    expected_evidence:
      - path: src/main/java/com/acme/order/Order.java

  - id: q020
    category: 事实查询
    question: 样例工程使用的是哪种构建工具？
    expected_evidence:
      - path: pom.xml
      - path: README.md

  - id: q021
    category: 事实查询
    question: 样例工程的 Maven 坐标是什么？
    expected_evidence:
      - path: pom.xml

  - id: q022
    category: 实现解释
    question: 订单金额最多保留几位小数？
    expected_evidence:
      - path: src/main/java/com/acme/order/OrderService.java
      - path: docs/api/order-api.md

  - id: q023
    category: 实现解释
    question: 订单创建时参数校验失败会抛出什么异常？
    expected_evidence:
      - path: src/main/java/com/acme/order/OrderService.java

  - id: q024
    category: 拒答
    question: 样例工程使用的是哪个关系型数据库？
    expect_refusal: true
    note: 样例只有仓储接口，没有任何数据库实现或依赖

  # ---------- 生成文档通道：Javadoc 与 OpenAPI ----------

  - id: q025
    category: 文档查询
    question: 接口文档里创建订单接口的请求体包含哪些字段？
