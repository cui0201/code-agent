name: code-agent-self
description: >
  针对 code-agent 项目自身的评测集。
  它比样例工程更接近真实场景：语料里有源码、设计文档、学习路线与 README，
  问题也覆盖了检索原理、设计决策、拒答边界等不同类别。
cases:
  # ---------- 检索原理：答案在源码里 ----------
  - id: s001
    category: 实现解释
    question: 余弦相似度是怎么算的？归一化之后点积能代替它吗？
    expected_evidence:
      - path: code-agent-core/src/main/java/com/example/codeagent/core/math/VectorMath.java
    note: 手写的向量数学工具，注释里解释了归一化与点积的关系

  - id: s002
    category: 实现解释
    question: BM25 的打分公式里 k1 和 b 分别控制什么？
